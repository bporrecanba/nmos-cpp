name: Build Windows Binaries

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Conan and Ninja
        run: |
          pip install conan~=2.20
          choco install ninja -y

      - name: Configure
        shell: cmd
        run: |
          cd Development
          mkdir build
          cd build
          cmake .. -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES:STRING="third_party/cmake/conan_provider.cmake"

      - name: Build
        shell: cmd
        run: |
          cd Development/build
          cmake --build . --config Release

      - name: Collect binaries
        shell: pwsh
        run: |
          mkdir artifact
          Get-ChildItem -Path Development/build -Recurse -Include *.exe,*.dll | Copy-Item -Destination artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nmos-cpp-windows-x64
          path: artifact/
