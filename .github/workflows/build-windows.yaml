name: Build Windows Binaries

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Conan
        run: pip install conan~=2.20

      - name: Detect default Conan profile
        run: conan profile detect --force

      - name: Configure
        shell: cmd
        run: |
          cd Development
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -DCMAKE_CONFIGURATION_TYPES:STRING="Release" -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES:STRING="third_party/cmake/conan_provider.cmake" -DCONAN_INSTALL_ARGS:STRING="--build=missing"

      - name: Build
        shell: cmd
        run: |
          cd Development/build
          cmake --build . --config Release --parallel

      - name: Collect binaries
        shell: pwsh
        run: |
          mkdir artifact
          Get-ChildItem -Path Development/build -Recurse -Include *.exe,*.dll -ErrorAction SilentlyContinue | Where-Object { $_.DirectoryName -match 'Release' -or $_.DirectoryName -match 'bin' } | Copy-Item -Destination artifact/
          # Also grab any DLLs from Conan cache
          Get-ChildItem -Path "$env:USERPROFILE/.conan2" -Recurse -Filter *.dll -ErrorAction SilentlyContinue | Copy-Item -Destination artifact/ -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nmos-cpp-windows-x64
          path: artifact/
